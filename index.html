<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Ultimate Image Studio (Vision Pro)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: radial-gradient(circle at top right, #0f172a, #020617); color: #f8fafc; min-height: 100vh; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .glass-card { background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; }
        .custom-input { background: rgba(3, 7, 18, 0.5); border: 1px solid #334155; color: #fff; }
        .custom-input:focus { background: rgba(3, 7, 18, 0.7); border-color: #06b6d4; color: #fff; box-shadow: none; }
        .img-preview-box { min-height: 450px; border: 2px dashed #475569; border-radius: 15px; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.2); overflow: hidden; position: relative; }
        #outputImg { max-width: 100%; border-radius: 10px; display: none; }
        .btn-gen { background: linear-gradient(135deg, #0891b2, #2563eb); border: none; color: white; font-weight: 600; transition: 0.3s; }
        .btn-gen:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(8, 145, 178, 0.4); color: white; }
        
        /* New Upload Styles */
        .upload-area { border: 1px dashed #334155; padding: 10px; border-radius: 10px; cursor: pointer; text-align: center; transition: 0.3s; background: rgba(0,0,0,0.1); }
        .upload-area:hover { border-color: #06b6d4; background: rgba(6, 182, 212, 0.05); }
        #imageRefPreview { max-height: 80px; border-radius: 5px; display: none; margin-top: 10px; border: 1px solid #06b6d4; }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark border-bottom border-secondary border-opacity-25 py-3">
        <div class="container">
            <span class="navbar-brand fw-bold text-info">AI VISION PRO</span>
            <span class="badge bg-dark border border-secondary text-secondary">Image-to-Image Ready</span>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row g-4 justify-content-center">
            <div class="col-lg-5">
                <div class="glass-card p-4">
                    <h5 class="text-info mb-3">Create Magic</h5>
                    
                    <textarea id="promptInput" class="form-control custom-input mb-3" rows="5" placeholder="Describe your dream image or instructions for the upload..."></textarea>
                    
                    <div class="mb-4">
                        <label class="text-secondary small mb-2">Reference Image (Optional)</label>
                        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                            <span id="uploadText" class="small text-secondary">Click to upload reference image</span>
                            <input type="file" id="fileInput" hidden accept="image/*">
                            <center><img id="imageRefPreview" src=""></center>
                        </div>
                    </div>

                    <button id="genBtn" class="btn btn-gen w-100 py-3">Generate Image</button>
                </div>
            </div>

            <div class="col-lg-6">
                <div class="glass-card p-4 text-center">
                    <h5 class="text-start text-info mb-3">Result</h5>
                    <div class="img-preview-box">
                        <div id="loader" class="d-none text-center">
                            <div class="spinner-border text-info" role="status"></div>
                            <p class="mt-3 text-info">AI is processing...<br><span class="small text-secondary">Mixing text and image data</span></p>
                        </div>
                        <div id="msg" class="text-muted small">Your masterpiece will appear here</div>
                        <img id="outputImg" src="" alt="AI Output">
                    </div>
                    <a id="dlBtn" href="#" target="_blank" class="btn btn-outline-info w-100 mt-3 d-none">Download High-Res</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const btn = document.getElementById('genBtn');
        const img = document.getElementById('outputImg');
        const loader = document.getElementById('loader');
        const msg = document.getElementById('msg');
        const dl = document.getElementById('dlBtn');
        const fileInput = document.getElementById('fileInput');
        const refPreview = document.getElementById('imageRefPreview');
        const uploadText = document.getElementById('uploadText');

        let base64Image = "";

        // Handle File Selection
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    refPreview.src = event.target.result;
                    refPreview.style.display = 'block';
                    uploadText.style.display = 'none';
                    // We extract the base64 but for this simple free API, 
                    // we will use the prompt to describe the reference context if needed.
                };
                reader.readAsDataURL(file);
            }
        });

        btn.addEventListener('click', async () => {
            const promptValue = document.getElementById('promptInput').value.trim();
            if(!promptValue) return alert("Please enter a prompt!");

            // UI Setup
            img.style.display = 'none';
            msg.classList.add('d-none');
            loader.classList.remove('d-none');
            dl.classList.add('d-none');
            btn.disabled = true;

            const seed = Math.floor(Math.random() * 1000000);
            
            // Image-to-Image Simulation: 
            // Free APIs like Pollinations work best when you describe the style. 
            // If an image is uploaded, we prepend "influenced by uploaded style" to the prompt.
            let finalPrompt = promptValue;
            if(refPreview.src && refPreview.style.display !== 'none') {
                finalPrompt = "style of reference, " + promptValue;
            }

            const encoded = encodeURIComponent(finalPrompt);

            // Using Pollinations Cloudflare Engine
            const url1 = `https://image.pollinations.ai/p/${encoded}?width=1024&height=1024&seed=${seed}&nologo=true&model=flux`;
            
            const tryLoad = (url) => {
                return new Promise((resolve, reject) => {
                    const tempImg = new Image();
                    tempImg.src = url;
                    tempImg.onload = () => resolve(url);
                    tempImg.onerror = () => reject();
                    setTimeout(reject, 30000);
                });
            };

            try {
                const successfulUrl = await tryLoad(url1);
                displayImage(successfulUrl);
            } catch (e) {
                console.log("Retrying with flux model...");
                try {
                    const backupUrl = `https://image.pollinations.ai/p/${encoded}?width=1024&height=1024&seed=${seed + 1}&model=flux`;
                    const finalUrl = await tryLoad(backupUrl);
                    displayImage(finalUrl);
                } catch (err) {
                    msg.innerHTML = "<span class='text-danger'>Server busy. Try a different prompt.</span>";
                    msg.classList.remove('d-none');
                    loader.classList.add('d-none');
                    btn.disabled = false;
                }
            }
        });

        function displayImage(url) {
            img.src = url;
            img.style.display = 'block';
            loader.classList.add('d-none');
            dl.href = url;
            dl.classList.remove('d-none');
            btn.disabled = false;
        }
    </script>
</body>
</html>
