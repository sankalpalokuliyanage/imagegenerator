<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real AI BG Remover</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #020617; color: #f8fafc; min-height: 100vh; font-family: 'Inter', sans-serif; }
        .glass-card { background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; }
        .preview-box { 
            min-height: 380px; border: 2px dashed #1e293b; border-radius: 15px; 
            display: flex; align-items: center; justify-content: center; 
            background: #0f172a url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAMUlEQVQ4T2NkYGAQYcAP3MvLywXyif8fP3688Pnz5yjnOX78+JEvDXYjdH0A48GFAnVAZpc/qy8AAAAASUVORK5CYII=');
        }
        #resultImg { max-width: 100%; border-radius: 10px; display: none; }
        .btn-cyan { background: #06b6d4; border: none; color: white; font-weight: 600; }
        .btn-cyan:hover { background: #22d3ee; color: white; }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark border-bottom border-slate-800 py-3">
        <div class="container text-center">
            <span class="navbar-brand fw-bold text-cyan mx-auto">REAL AI BG REMOVER</span>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row g-4 justify-content-center">
            <div class="col-lg-5">
                <div class="glass-card p-4">
                    <h5 class="text-white mb-4">Step 1: Upload</h5>
                    <input type="file" id="imageInput" class="form-control bg-dark border-slate-700 text-white mb-3" accept="image/*">
                    <img id="inputPreview" src="" class="img-fluid rounded d-none" style="max-height: 200px;">
                    <button id="processBtn" class="btn btn-cyan w-100 py-3 mt-3" disabled>Remove Background</button>
                </div>
            </div>

            <div class="col-lg-6">
                <div class="glass-card p-4 text-center">
                    <h5 class="text-start text-white mb-3">Step 2: Result</h5>
                    <div class="preview-box">
                        <div id="loading" class="d-none">
                            <div class="spinner-border text-cyan" role="status"></div>
                            <p class="mt-3 text-cyan">AI is removing background...<br><span class="text-muted small">Processing through Remove.bg API</span></p>
                        </div>
                        <div id="placeholder" class="text-slate-500 small">Transparent image will appear here</div>
                        <img id="resultImg" src="" alt="Result">
                    </div>
                    <a id="downloadBtn" href="#" download="no-bg.png" class="btn btn-outline-cyan w-100 mt-3 d-none">Download PNG</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const inputPreview = document.getElementById('inputPreview');
        const processBtn = document.getElementById('processBtn');
        const resultImg = document.getElementById('resultImg');
        const loading = document.getElementById('loading');
        const placeholder = document.getElementById('placeholder');
        const downloadBtn = document.getElementById('downloadBtn');

        // !!! ඔබේ REMOVE.BG API KEY එක මෙතැනට ඇතුළත් කරන්න !!!
        const API_KEY = 'hCSBprbZCHXGgPkNWX91HoYk';

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                inputPreview.src = URL.createObjectURL(file);
                inputPreview.classList.remove('d-none');
                processBtn.disabled = false;
            }
        });

        processBtn.addEventListener('click', async () => {
            const file = imageInput.files[0];
            if (!file) return;

            if (API_KEY === 'YOUR_REMOVE_BG_API_KEY') {
                alert("කරුණාකර code එකේ ඇති 'YOUR_REMOVE_BG_API_KEY' වෙනුවට ඔබේ Remove.bg API Key එක ඇතුළත් කරන්න.");
                return;
            }

            // UI Reset
            loading.classList.remove('d-none');
            placeholder.classList.add('d-none');
            resultImg.style.display = 'none';
            downloadBtn.classList.add('d-none');
            processBtn.disabled = true;

            const formData = new FormData();
            formData.append('image_file', file);
            formData.append('size', 'auto'); // 'auto', 'full', 'preview'

            try {
                const response = await fetch('https://api.remove.bg/v1.0/removebg', {
                    method: 'POST',
                    headers: {
                        'X-Api-Key': API_KEY,
                    },
                    body: formData
                });

                if (response.ok) {
                    const blob = await response.blob();
                    const url = URL.createObjectURL(blob);
                    
                    resultImg.src = url;
                    resultImg.style.display = 'block';
                    loading.classList.add('d-none');
                    downloadBtn.href = url;
                    downloadBtn.classList.remove('d-none');
                } else {
                    const error = await response.json();
                    alert(`Error: ${error.errors[0].title}`);
                    loading.classList.add('d-none');
                    placeholder.classList.remove('d-none');
                }

            } catch (error) {
                console.error(error);
                alert("API Connection Error. Please check your internet connection.");
                loading.classList.add('d-none');
                placeholder.classList.remove('d-none');
            } finally {
                processBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
