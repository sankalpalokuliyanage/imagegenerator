<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI BG Remover Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0f172a; color: #f8fafc; min-height: 100vh; font-family: 'Segoe UI', sans-serif; }
        .glass-card { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; }
        .preview-box { 
            min-height: 350px; border: 2px dashed #334155; border-radius: 15px; 
            display: flex; align-items: center; justify-content: center; 
            background-image: linear-gradient(45deg, #1e293b 25%, transparent 25%), linear-gradient(-45deg, #1e293b 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #1e293b 75%), linear-gradient(-45deg, transparent 75%, #1e293b 75%);
            background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
        #outputCanvas { max-width: 100%; border-radius: 10px; display: none; }
        .btn-action { background: #06b6d4; border: none; color: white; font-weight: bold; }
        .btn-action:hover { background: #0891b2; color: white; }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark border-bottom border-secondary py-3">
        <div class="container text-center">
            <span class="navbar-brand fw-bold text-info mx-auto">AI BACKGROUND REMOVER</span>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row g-4 justify-content-center">
            <div class="col-lg-5">
                <div class="glass-card p-4 text-center">
                    <h5 class="text-info mb-4">Step 1: Upload Image</h5>
                    <input type="file" id="fileInput" class="form-control bg-dark text-light border-secondary mb-4" accept="image/*">
                    <div id="originalPreview" class="mb-3">
                        <p class="small text-secondary">Original preview will show here</p>
                        <img id="sourceImg" src="" style="max-width: 100%; max-height: 200px; border-radius: 10px; display:none;">
                    </div>
                    <button id="removeBtn" class="btn btn-action w-100 py-3" disabled>Remove Background</button>
                </div>
            </div>

            <div class="col-lg-6">
                <div class="glass-card p-4 text-center">
                    <h5 class="text-start text-info mb-3">Step 2: Result</h5>
                    <div class="preview-box">
                        <div id="loader" class="d-none">
                            <div class="spinner-border text-info" role="status"></div>
                            <p class="mt-3 text-info">AI is removing background...<br><span class="small text-secondary">Processing on your browser (First time may take a moment)</span></p>
                        </div>
                        <canvas id="outputCanvas"></canvas>
                    </div>
                    <a id="downloadBtn" href="#" download="no-bg.png" class="btn btn-outline-info w-100 mt-3 d-none">Download Transparent PNG</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/dist/index.js"></script>

    <script>
        const fileInput = document.getElementById('fileInput');
        const sourceImg = document.getElementById('sourceImg');
        const removeBtn = document.getElementById('removeBtn');
        const canvas = document.getElementById('outputCanvas');
        const loader = document.getElementById('loader');
        const downloadBtn = document.getElementById('downloadBtn');

        // 1. Show preview when file is selected
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                sourceImg.src = URL.createObjectURL(file);
                sourceImg.style.display = 'block';
                removeBtn.disabled = false;
            }
        });

        // 2. Remove Background Logic
        removeBtn.addEventListener('click', async () => {
            const file = fileInput.files[0];
            if (!file) return;

            // UI Reset
            loader.classList.remove('d-none');
            canvas.style.display = 'none';
            downloadBtn.classList.add('d-none');
            removeBtn.disabled = true;

            try {
                // Config can be empty for default AI settings
                const config = {
                    progress: (status, progress) => {
                        console.log(`Status: ${status} (${Math.round(progress * 100)}%)`);
                    }
                };

                // The Magic: Process the image
                const blob = await imglyRemoveBackground(file, config);
                
                // Load the result to Canvas
                const url = URL.createObjectURL(blob);
                const ctx = canvas.getContext('2d');
                const resultImg = new Image();
                
                resultImg.onload = () => {
                    canvas.width = resultImg.width;
                    canvas.height = resultImg.height;
                    ctx.drawImage(resultImg, 0, 0);
                    
                    canvas.style.display = 'block';
                    loader.classList.add('d-none');
                    
                    // Setup download
                    downloadBtn.href = url;
                    downloadBtn.classList.remove('d-none');
                    removeBtn.disabled = false;
                };
                resultImg.src = url;

            } catch (error) {
                console.error(error);
                alert("Error processing image. Make sure you are using a modern browser.");
                loader.classList.add('d-none');
                removeBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
