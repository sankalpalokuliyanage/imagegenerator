<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Ultimate Image Studio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: radial-gradient(circle at top right, #0f172a, #020617); color: #f8fafc; min-height: 100vh; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .glass-card { background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; }
        .custom-input { background: rgba(3, 7, 18, 0.5); border: 1px solid #334155; color: #fff; }
        .custom-input:focus { background: rgba(3, 7, 18, 0.7); border-color: #06b6d4; color: #fff; box-shadow: none; }
        .img-preview-box { min-height: 450px; border: 2px dashed #475569; border-radius: 15px; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.2); overflow: hidden; }
        #outputImg { max-width: 100%; border-radius: 10px; display: none; }
        .btn-gen { background: linear-gradient(135deg, #0891b2, #2563eb); border: none; color: white; font-weight: 600; transition: 0.3s; }
        .btn-gen:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(8, 145, 178, 0.4); color: white; }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark border-bottom border-secondary border-opacity-25 py-3">
        <div class="container">
            <span class="navbar-brand fw-bold text-info">AI VISION PRO</span>
            <span class="badge bg-dark border border-secondary text-secondary">High-Speed Engine</span>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row g-4 justify-content-center">
            <div class="col-lg-5">
                <div class="glass-card p-4">
                    <h5 class="text-info mb-3">Create Magic</h5>
                    <textarea id="promptInput" class="form-control custom-input mb-4" rows="6" placeholder="Describe your dream image (e.g. 'A futuristic robot in a garden, ultra realistic, 4k')"></textarea>
                    <button id="genBtn" class="btn btn-gen w-100 py-3">Generate Image</button>
                </div>
            </div>

            <div class="col-lg-6">
                <div class="glass-card p-4 text-center">
                    <h5 class="text-start text-info mb-3">Result</h5>
                    <div class="img-preview-box">
                        <div id="loader" class="d-none">
                            <div class="spinner-border text-info" role="status"></div>
                            <p class="mt-3 text-info">AI is generating... (this may take 10-20s)</p>
                        </div>
                        <div id="msg" class="text-muted small">Your masterpiece will appear here</div>
                        <img id="outputImg" src="" alt="AI Output">
                    </div>
                    <a id="dlBtn" href="#" target="_blank" class="btn btn-outline-info w-100 mt-3 d-none">Download High-Res</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const btn = document.getElementById('genBtn');
        const img = document.getElementById('outputImg');
        const loader = document.getElementById('loader');
        const msg = document.getElementById('msg');
        const dl = document.getElementById('dlBtn');

        btn.addEventListener('click', async () => {
            const prompt = document.getElementById('promptInput').value.trim();
            if(!prompt) return alert("Please enter a prompt!");

            // UI Setup
            img.style.display = 'none';
            msg.classList.add('d-none');
            loader.classList.remove('d-none');
            dl.classList.add('d-none');
            btn.disabled = true;

            const seed = Math.floor(Math.random() * 1000000);
            const encoded = encodeURIComponent(prompt);

            // TRY SERVER 1 (Cloudflare / Pollinations Hybrid)
            const url1 = `https://image.pollinations.ai/p/${encoded}?width=1024&height=1024&seed=${seed}&nologo=true`;
            
            // TRY SERVER 2 (Alternative Open Access)
            const url2 = `https://api.airforce/v1/image/generations?prompt=${encoded}&model=flux`;

            const tryLoad = (url) => {
                return new Promise((resolve, reject) => {
                    const tempImg = new Image();
                    tempImg.src = url;
                    tempImg.onload = () => resolve(url);
                    tempImg.onerror = () => reject();
                    // Timeout after 25 seconds
                    setTimeout(reject, 25000);
                });
            };

            try {
                // පළවෙනි සර්වර් එකෙන් ට්‍රයි කරනවා
                const successfulUrl = await tryLoad(url1);
                displayImage(successfulUrl);
            } catch (e) {
                console.log("Server 1 failed, trying Backup Server...");
                try {
                    // පළවෙනි එක වැඩ නැත්නම් දෙවැනි එකෙන් ට්‍රයි කරනවා
                    const backupUrl = `https://image.pollinations.ai/p/${encoded}?width=1024&height=1024&seed=${seed + 1}&model=flux`;
                    const finalUrl = await tryLoad(backupUrl);
                    displayImage(finalUrl);
                } catch (err) {
                    msg.innerHTML = "<span class='text-danger'>Both servers are busy. Please wait 10 seconds and try again.</span>";
                    msg.classList.remove('d-none');
                    loader.classList.add('d-none');
                    btn.disabled = false;
                }
            }
        });

        function displayImage(url) {
            img.src = url;
            img.style.display = 'block';
            loader.classList.add('d-none');
            dl.href = url;
            dl.classList.remove('d-none');
            btn.disabled = false;
        }
    </script>
</body>
</html>
